name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          # Yarn's cache is not shared between runs here, and that is on
          # purpose. `@arkadia/plugin-types` is a tarball at a fixed URL that the
          # extension republishes with a fresh timestamp version - so a fresh
          # hash, and a fresh cache folder - on every push. There is nothing to
          # reuse from run to run, and the one time the cache does carry that
          # folder across it carries a half-written one: yarn fetched it under
          # the new integrity hash without writing the .yarn-metadata.json it
          # looks for while linking, and every later run then restored the
          # broken entry and failed with ENOENT on it. The install is a few
          # seconds either way.
          package-manager-cache: false

      # `--update-checksums` is for one dependency. `@arkadia/plugin-types` is a
      # tarball at a fixed URL, and the extension republishes it with a fresh
      # timestamp version - so a fresh hash - on every push, whether or not the
      # types changed. Pinning it in the lockfile would break this build on an
      # unrelated repository's activity. Everything else stays pinned.
      - name: Install dependencies
        run: yarn install --update-checksums --network-timeout 100000

      - name: Typecheck and test
        run: yarn typecheck && yarn test

      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
