name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # `@arkadia/plugin-types` is a tarball at a fixed URL, and the extension
      # republishes it - with a fresh timestamp version, and so a fresh hash -
      # on every push of its own, whether or not the types changed. So the
      # lockfile pins a version that has usually already been replaced by the
      # time this runs, and this build would otherwise break on an unrelated
      # repository's activity.
      #
      # `--update-checksums` alone does not cope with it, because it is not only
      # the checksum that moves: yarn names the cache folder after the *locked*
      # version, unpacks the newly fetched one under its own, and then fails
      # looking for a .yarn-metadata.json that was never written under the name
      # it is reading. Dropping the entry lets yarn resolve this one package
      # from scratch. Everything else stays pinned by the lockfile.
      - name: Unpin the types tarball
        run: sed -i '/^"@arkadia\/plugin-types@/,/^$/d' yarn.lock

      - name: Install dependencies
        run: yarn install --update-checksums --network-timeout 100000

      - name: Typecheck and test
        run: yarn typecheck && yarn test

      - name: Build
        run: yarn build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
